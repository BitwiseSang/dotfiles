# ~/.tmux.conf
# Rebuilt from your original config: same prefix, same keybinds, same
# status-bar position — tuned for performance, true-color fidelity, and a
# fully transparent status bar that won't fight your Kitty theme.

# ============================================================================
# 1. GENERAL SETTINGS
# ============================================================================
set -g prefix C-s                     # Leader key: Ctrl+s
set -g mouse on                       # Mouse support
set -g status-position top            # Status bar on top
set -g base-index 1
set -g renumber-windows on            # Re-index windows on close

set-window-option -g automatic-rename off
set-window-option -g allow-rename off

# --- Performance & responsiveness (the single biggest quality-of-life win) ---
set -sg escape-time 0                 # No delay after Esc — critical for Vim/Neovim
set -g repeat-time 300                # Window for repeatable prefix binds (resize, etc.)
set -g focus-events on                # Lets Vim/apps detect terminal focus in/out
set -g history-limit 50000            # Bigger scrollback, still cheap
set -g status-interval 5              # Redraw status less often = less CPU churn
set -g display-time 2000
set -g display-panes-time 2000
set -g aggressive-resize on           # Correct sizing when the same session is viewed in two windows

# --- Titles & misc ---
set -g set-titles on
set -g set-titles-string "#T - #W"
setw -g mode-keys vi                  # Vi-style keys in copy-mode (doesn't touch your normal-mode binds)
set -g allow-passthrough on           # Lets Kitty's image/graphics protocol (e.g. nvim image previews) draw through tmux
set -g visual-activity off

# ============================================================================
# 2. TRUE COLOR (CRITICAL for icons/colors, done the modern way)
# ============================================================================
set -g default-terminal "tmux-256color"

# Modern RGB negotiation with Kitty (tmux ≥3.2)
set -as terminal-features ",xterm-256color:RGB"

# Undercurl + colored-underline support (great for LSP diagnostics in Neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ',*:usstyle'

# ============================================================================
# 3. KEYBINDS
# ============================================================================
# Hot reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Vim motions for pane navigation (prefix + hjkl)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Seamless nvim ↔ tmux navigation (C-h/j/k/l — no prefix needed)
# These work in tandem with the alexghergh/nvim-tmux-navigation plugin:
# when the active pane is running Neovim, the plugin handles the key;
# otherwise tmux navigates panes directly.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Split panes with | and -
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Repeatable pane resizing with prefix + H/J/K/L (uppercase, so it can't clash
# with your lowercase pane-navigation binds above)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window navigation
bind -n M-Left previous-window
bind -n M-Right next-window

# Swap windows left/right without leaving the keyboard home row
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Reload-friendly pane sync toggle (handy for running the same command everywhere)
bind S set-window-option synchronize-panes \; display "Sync panes: #{?pane_synchronized,ON,OFF}"

# Copy mode: enter visual selection (tmux-yank handles the 'y' clipboard binding)
bind -T copy-mode-vi v send-keys -X begin-selection

# ============================================================================
# 4. CATPPUCCIN — theme, tuned so segments are truly transparent
# ============================================================================
set -g @catppuccin_flavor "mocha"

set -g @catppuccin_status_background "none"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_window_status_style "basic"

# Belt-and-suspenders: force the raw tmux background to transparent
# regardless of what this catppuccin version does under the hood
set -g status-style "bg=default"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# The default folder icon isn't in every Nerd Font build (that's what caused
# the blank white box). This glyph is far more consistently included. If it
# still shows a box, your Kitty font isn't a patched Nerd Font — check
# font_family in kitty.conf and switch to one from nerdfonts.com.
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# Pane borders — uncomment to override the catppuccin palette
# set -g pane-border-style "fg=#45475a"
# set -g pane-active-border-style "fg=#89b4fa"

# ============================================================================
# 5. PLUGINS
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Clipboard integration — makes mouse-drag copy and copy-mode 'y' hit the
# system clipboard reliably across X11/Wayland
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence — survive reboots/crashes without losing your layout
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# ============================================================================
# 6. STATUS LINE
# ============================================================================
set -g status-right-length 100
set -g status-left-length 100

set -g status-left "#{E:@catppuccin_status_window}"

set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"

# Initialize TMUX plugin manager (must stay at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
