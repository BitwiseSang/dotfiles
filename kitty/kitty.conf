# Window size
remember_window_size  no
initial_window_width  110c
initial_window_height 20c

# Font
# font_family       Fira Code
# font_family       FiraCode Nerd Font
font_family       JetBrainsMono Nerd Font

bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         13
font_features     FiraCode-Retina +zero +onum
disable_ligatures never

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# wayland_titlebar_color background

# Scrolling
wheel_scroll_multiplier 0.95
touch_scroll_multiplier 0.95

# Keybindings: Clipboard
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Keybindings: Window Resizing
# Uses Kitty's standard ctrl+shift modifier
map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter

# Allow remote control
allow_remote_control yes

# Cursor
cursor_shape block
# cursor_shape beam
# cursor_shape underline

# Smear cursor effect
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
#
# Nord Colors
# cursor_trail_color #bf616a
# cursor_trail_color #d08770
# cursor_trail_color #ebcb8b
cursor_trail_color #a3be8c
# cursor_trail_color #b48ead


cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Background Opacity
background_opacity 1
dynamic_background_opacity yes
# background_blur 32

# Nerd Fonts v3.x.x Symbol Mapping for Kitty
symbol_map U+E5FA-U+E6B1,U+EB4F-U+EB4F,U+EA60-U+EBEB,U+E200-U+E2A9,U+F000-U+F2E0,U+E300-U+E3E3,U+F400-U+F533,U+F300-U+F375,U+E700-U+E7C5,U+ED00-U+EFC1,U+E200-U+E2A9,U+E0A0-U+E0A2,U+E0B0-U+E0B3,U+E0A3-U+E0A3,U+E0B4-U+E0C8,U+E0CA-U+E0CA,U+E0CC-U+E0D4,U+23FB-U+23FE,U+2B58-U+2B58,U+F500-U+FD46,U+E000-U+E00A,U+2111-U+2111,U+2118-U+2118,U+212E-U+212E,U+25A0-U+25A0,U+2615-U+2615,U+2665-U+2665,U+26A1-U+26A1,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# BEGIN_KITTY_THEME
# Nord
include current-theme.conf
# END_KITTY_THEME
